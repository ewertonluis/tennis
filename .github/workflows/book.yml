name: Book tennis
run-name: ${{ inputs.source == 'cron' && 'Book tennis (scheduled)' || 'Book tennis' }}

on:
  schedule:
    # Backup for the external trigger (see README). Registration opens at 19:30 Paris time.
    # GitHub cron is UTC and has started runs 2-3.5 hours late, so start ~5.5 hours early;
    # the script waits for the exact opening time.
    - cron: '5 12 * * *' # summer (CEST): opening = 17:30 UTC
    - cron: '5 13 * * *' # winter (CET):  opening = 18:30 UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Book a specific date now (YYYY-MM-DD). Empty = scheduled mode'
        required: false
      dry_run:
        description: 'Dry run (log in and check, but do not book)'
        type: boolean
        default: true
      source:
        description: 'Set to "cron" by the external scheduler (shows the run as Scheduled)'
        required: false

permissions:
  contents: read
  actions: write # starts the Dashboard workflow when the bot did something

concurrency:
  group: book-tennis
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub's maximum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: book
        run: node book.mjs
        env:
          DOIN_EMAIL: ${{ secrets.DOIN_EMAIL }}
          DOIN_PASSWORD: ${{ secrets.DOIN_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }} # re-reads plan.json right before registering
          BOOK_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          # GitHub's own schedule starts early and waits; the external checks run every 15 minutes.
          LOOKAHEAD_MINUTES: ${{ github.event_name == 'schedule' && 330 || 20 }} # must fit inside timeout-minutes
      - if: always() && (steps.book.outputs.acted == 'true' || failure())
        run: gh workflow run dashboard.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
